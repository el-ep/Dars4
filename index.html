<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مدار الکتریکی - خانم پراش</title>
<style>
:root{--ink:#1f2a44;--b:#2f7bff;--ln:#d6e0f5;--ok:#1faa59;--bad:#e5383b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:Tahoma,Arial,sans-serif;background:#fff;color:var(--ink);display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--ln);flex:none}
h1{font-size:15px;margin:0;white-space:nowrap}
#dots{display:flex;gap:4px}#dots i{width:9px;height:9px;border-radius:50%;background:var(--ln)}#dots i.on{background:var(--b)}
button{font-family:inherit;border:0;cursor:pointer}
.btn{background:var(--b);color:#fff;padding:9px 16px;border-radius:12px;font-size:14px;font-weight:bold}
.btn.g{background:#eef3ff;color:var(--b)}
#done{margin-inline-start:auto}
main{flex:1;min-height:0;position:relative;padding:10px;display:flex}
footer{flex:none;text-align:center;font-size:12px;color:#7b86a3;padding:6px;border-top:1px solid var(--ln)}
.scr{display:none;flex:1;min-width:0;flex-direction:column;gap:10px;position:relative}.scr.on{display:flex}
.hint{margin:0;font-size:14px;text-align:center;color:#51608a}
.row{display:flex;gap:12px;justify-content:center}
.card,.tgt{flex:1;max-width:230px;border:2px solid var(--ln);border-radius:16px;padding:8px;text-align:center;position:relative;background:#fff}
.card{touch-action:none;cursor:grab}.card img{width:100%;display:block;pointer-events:none}
.num{position:absolute;top:6px;right:8px;background:var(--b);color:#fff;border-radius:8px;padding:0 8px;font-size:15px}
.tgt{border-style:dashed;padding:26px 8px;font-size:20px;font-weight:bold;background:#f6f9ff}
.dot{position:absolute;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--b);border:2px solid #fff;box-shadow:0 0 0 1px var(--b)}
.card .dot{bottom:-8px}.tgt .dot{top:-8px}
.sp{flex:1}#ov,#wv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.zone{border:2px dashed var(--ln);border-radius:16px;padding:8px;background:#f6f9ff}
.zone h4{margin:0 0 6px;text-align:center;font-size:17px}
.in,.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:84px;align-content:flex-start}
.bank{background:#fff;border-style:solid;flex:none}
.zs{display:flex;gap:10px;flex:1;min-height:0}.zs .zone{flex:1;display:flex;flex-direction:column}.zs .in{flex:1}
.it{width:76px;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:4px;text-align:center;font-size:12px;touch-action:none;cursor:grab}
.it img{width:100%;height:52px;object-fit:contain;display:block;pointer-events:none}
.ghost{position:fixed;pointer-events:none;z-index:50;opacity:.9;transform:translate(-50%,-50%)}
#cv{flex:1;min-height:0;position:relative;border:2px dashed var(--ln);border-radius:16px;background:#fbfcff;touch-action:none;overflow:hidden}
.pt{position:absolute;touch-action:none;cursor:grab}.pt img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.td{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #e5383b;transform:translate(-50%,-50%)}
.sg{position:absolute;font-weight:bold;font-size:15px}
#nav{flex:none;display:flex;gap:8px;overflow-x:auto;padding:8px;border:2px solid var(--ln);border-radius:16px;min-height:86px;align-items:center;background:#fff}
.sl{flex:none;width:68px;text-align:center;font-size:12px;border:2px solid var(--ln);border-radius:12px;padding:4px;touch-action:none;cursor:grab}
.sl img{width:100%;height:42px;object-fit:contain;display:block;pointer-events:none}.sl.sel{border-color:var(--bad);background:#fff1f1}
.q{border:1px solid var(--ln);border-radius:14px;padding:10px}.q p{margin:0 0 8px;font-size:15px;line-height:1.7}
.q .o{display:inline-block;margin:3px;padding:7px 16px;border-radius:10px;background:#eef3ff;color:var(--ink);font-size:14px}.q .o.s{background:var(--b);color:#fff}
#qs{overflow-y:auto;display:flex;flex-direction:column;gap:8px}
#res{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;text-align:center}
#res.bad{display:flex;background:var(--bad);color:#fff}#res.ok{display:flex;background:var(--ok);color:#fff}
#res p{max-width:340px;line-height:1.8}#res h2{font-size:40px;margin:0 0 8px}#res p{margin:0 0 18px;font-size:16px}#res .btn{margin:4px}
#res.bad .btn{background:#fff;color:var(--bad)}#res.ok .btn{background:#fff;color:var(--ok)}
#fin{align-items:center;justify-content:center;text-align:center}#fin h2{font-size:30px;margin:0}
#toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;display:none;z-index:120}

.scr.on{animation:sin .45s ease both}
@keyframes sin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.card,.tgt{animation:pop .5s ease both;transition:transform .2s,box-shadow .2s,border-color .2s}.card:nth-child(2){animation-delay:.1s}
.card:hover,.card:active{transform:translateY(-4px);box-shadow:0 8px 18px #2f7bff30;border-color:var(--b)}
.tgt:hover{border-color:var(--b);background:#eaf1ff}
.dot{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 6px #2f7bff30}}
.it{animation:pop .45s ease both;transition:transform .2s}.it:hover{transform:translateY(-3px) rotate(-2deg)}.it.pp{animation:pop .35s ease}
.it:nth-child(2n){animation-delay:.08s}.it:nth-child(3n){animation-delay:.16s}
.zone{transition:border-color .2s,background .2s}
.pt.nw{animation:pop .35s ease}
.pt.lit img{animation:glow .9s ease-in-out infinite alternate}@keyframes glow{from{filter:drop-shadow(0 0 4px #ffd54a)}to{filter:drop-shadow(0 0 20px #ffb300) brightness(1.15)}}
#wv.flow line{stroke-dasharray:4 12;animation:fl .5s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}
.sl{transition:transform .2s,border-color .2s}.sl:hover{transform:translateY(-3px)}.sl.sel{animation:bob 1s ease-in-out infinite}
.btn{transition:transform .15s,box-shadow .15s}.btn:hover{transform:scale(1.06);box-shadow:0 4px 12px #0003}.btn:active{transform:scale(.94)}
#dots i{transition:background .4s,transform .4s}#dots i.on{transform:scale(1.35)}
#ttl{animation:sin .4s ease both}
.q{animation:sin .5s ease both}.q:nth-child(2){animation-delay:.1s}.q:nth-child(3){animation-delay:.2s}.q:nth-child(4){animation-delay:.3s}
.q .o{transition:transform .15s,background .2s}.q .o.s{animation:pop .3s ease}
#res>div{animation:pop .5s ease both}#res.bad>div{animation:pop .4s ease both,shake .5s .4s}
#res.ok h2,#fin h2{animation:bob 1.2s ease-in-out infinite}
#res.ok{animation:fadein .3s}#res.bad{animation:fadein .3s}@keyframes fadein{from{opacity:0}}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:101;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#fin{overflow-y:auto;gap:8px}#bd{width:100%;max-width:340px;font-size:14px}#bd div{display:flex;justify-content:space-between;padding:6px 10px;margin:4px 0;border-radius:10px;background:#f2f6ff;animation:sin .5s ease both}#nin{font-family:inherit;font-size:17px;padding:12px 14px;border:2px solid var(--ln);border-radius:12px;width:260px;max-width:90%;text-align:center;outline:none;user-select:text;-webkit-user-select:text;transition:border-color .2s,box-shadow .2s}#nin:focus{border-color:var(--b);box-shadow:0 0 0 4px #2f7bff25}</style></head><body>
<header><h1 id="ttl"></h1><div id="dots"></div><button class="btn" id="done">انجام دادم</button></header>
<main>
<section class="scr" id="intro" style="align-items:center;justify-content:center;text-align:center"><div style="font-size:54px;animation:bob 1.4s ease-in-out infinite">💡</div><h2 style="margin:0;font-size:26px">بازی مدار الکتریکی</h2><p class="hint">اسمت را بنویس و شروع کن</p><input id="nin" maxlength="30" placeholder="نام و نام خانوادگی" autocomplete="off"><div><button class="btn" id="go" style="font-size:18px;padding:12px 34px">شروع</button></div></section>
<section class="scr" id="s0"><p class="hint">با کشیدن خط نقطه‌چین، هر مدار را به نام درستش وصل کن</p>
<div class="row"><div class="card" data-k="par"><b class="num">۱</b><img data-i="par"><i class="dot"></i></div><div class="card" data-k="ser"><b class="num">۲</b><img data-i="ser"><i class="dot"></i></div></div>
<div class="sp"></div>
<div class="row"><div class="tgt" data-t="ser">متوالی<i class="dot"></i></div><div class="tgt" data-t="par">موازی<i class="dot"></i></div></div><svg id="ov"></svg></section>
<section class="scr" id="s1"><p class="hint">هر چیز را بکش و در جای درستش بگذار</p><div class="bank zone" data-z="b"></div>
<div class="zs"><div class="zone" data-z="c"><h4>رسانا</h4><div class="in"></div></div><div class="zone" data-z="n"><h4>نارسانا</h4><div class="in"></div></div></div></section>
<section class="scr" id="s2"><p class="hint" id="h3"></p><div id="cv"><svg id="wv"></svg></div><div id="nav"></div></section>
<section class="scr" id="s3"><div id="qs"></div></section>
<section class="scr" id="fin"><h2>🎉 تمام شد!</h2><div id="nm" style="font-size:26px;font-weight:bold"></div><div id="dt" style="font-size:12px;color:#7b86a3"></div><div id="st" style="font-size:34px"></div><p style="margin:0">امتیاز تو</p><div id="sc" style="font-size:60px;font-weight:900;color:var(--b);line-height:1.1">۰</div><p id="sm" style="margin:0;color:#51608a"></p><div id="bd"></div><div><button class="btn" onclick="restart()">شروع دوباره</button></div></section>
</main>
<footer>طراح: خانم پراش</footer>
<div id="res"><div><h2></h2><p></p><div id="rb"></div></div></div><div id="toast"></div>
